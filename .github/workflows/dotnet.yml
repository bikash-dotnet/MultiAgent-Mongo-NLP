# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Cache Nuget Packages
      uses: actions/cache@v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj','**/*.sln') }}
        restore-keys: | 
          ${{ runner.os }}-nuget-
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore src/gateway
    - name: Build
      run: dotnet build src/gateway --no-restore --configuration  Release
    - name: Test
      run: dotnet test src/gateway --no-build --verbosity normal
    - name: Cache Node Modules
      uses: actions/cache@v6.1.0
      with:
        path: src/web/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('src/web/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    - name: Setup Node.js
      uses: actions/setup-node@v6.5.0
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: src/web/package-lock.json
    - name: Install Angular dependencies
      working-directory: ./src/web
      run: npm ci
    - name: Build Angular
      working-directory: ./src/web
      run: npm run build -- --configuration production
