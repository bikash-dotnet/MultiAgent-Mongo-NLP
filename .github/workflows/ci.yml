name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/gateway
      - name: Build
        run: dotnet build src/gateway --no-restore --configuration Release
      - name: Test
        run: dotnet test tests/Gateway.Tests/Gateway.Tests.csproj --no-build --verbosity normal
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-results
          path: tests/Gateway.Tests/bin/Release/**/test-results.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install dependencies
        working-directory: src/web
        run: npm ci
      - name: Run tests
        working-directory: src/web
        run: npx ng test --watch=false
      - name: Build
        working-directory: src/web
        run: npx ng build --configuration production
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: src/web/dist

  secret-scan:
    runs-on: ubuntu-latest
    needs: [gateway, web]
    steps:
      - uses: actions/checkout@v5
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    runs-on: ubuntu-latest
    needs: [gateway, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build gateway image
        run: docker build -t gateway:ci -f src/gateway/Dockerfile .
      - name: Build web image
        run: docker build -t web:ci -f src/web/Dockerfile .
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-refs: gateway:ci,web:ci
          format: sarif
          output: trivy-results.sarif
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
