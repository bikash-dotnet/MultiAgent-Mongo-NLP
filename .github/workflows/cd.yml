name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "sha_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "semver_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/gateway:${{ steps.meta.outputs.semver_tag }},ghcr.io/${{ github.repository }}/gateway:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.semver_tag }},ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/deploy
            echo "${{ secrets.STAGING_ENV }}" > .env
            chmod 600 .env
            docker compose pull
            docker compose up -d --remove-orphans

  production:
    runs-on: ubuntu-latest
    environment: production
    needs: staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Manual approval checkpoint
        run: echo "Production deploy awaits manual approval in GitHub Environments"

      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "sha_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "semver_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/gateway:${{ steps.meta.outputs.semver_tag }},ghcr.io/${{ github.repository }}/gateway:${{ steps.meta.outputs.sha_tag }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.semver_tag }},ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.sha_tag }}

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/deploy
            echo "${{ secrets.PRODUCTION_ENV }}" > .env
            chmod 600 .env
            docker compose pull
            docker compose up -d --remove-orphans
