<div class="app-layout">
  <header class="app-topbar">
    <div class="topbar-left">
      <button pButton icon="pi pi-bars" [text]="true" class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu"></button>
      <span class="product-name">Multi-Agent NLP</span>
    </div>
    <div class="topbar-right">
      <button pButton icon="pi pi-user" [rounded]="true" [text]="true" aria-label="User profile"></button>
    </div>
  </header>

  <div class="app-body">
    <aside class="app-sidebar" [class.collapsed]="isMenuCollapsed">
      <p-panelMenu [model]="menuItems"></p-panelMenu>
    </aside>

    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
