services:
  gateway:
    image: ghcr.io/bikash-dotnet/MultiAgent-Mongo-NLP/gateway:latest
    build:
      context: ../..
      dockerfile: src/gateway/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: ghcr.io/bikash-dotnet/MultiAgent-Mongo-NLP/web:latest
    build:
      context: ../..
      dockerfile: src/web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
